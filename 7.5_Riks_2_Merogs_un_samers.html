<!DOCTYPE html>
<html lang="lv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>7.5 Mērogs un samērs – interaktīvs rīks</title>
<style>*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#0b2a23;font-family:Candara,"Segoe UI","Trebuchet MS",Verdana,sans-serif;color:#12332b}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{width:1600px;height:900px;flex:none;transform-origin:center center;background:#f6f7f4;position:relative;overflow:hidden;display:flex;flex-direction:column}
header.top{height:74px;flex:none;background:#006751;color:#fff;display:flex;align-items:center;padding:0 28px;gap:20px}
header.top .tema{background:#dbe68d;color:#12332b;font-weight:700;border-radius:8px;padding:6px 14px;font-size:22px;white-space:nowrap}
header.top h1{font-size:34px;font-weight:700;letter-spacing:.2px;white-space:nowrap}
header.top .sub{font-size:21px;opacity:.92;margin-left:auto;text-align:right;line-height:1.15;max-width:760px}
main{flex:1;min-height:0;position:relative;padding:18px 28px 10px}
footer.bot{height:62px;flex:none;display:flex;align-items:center;gap:14px;padding:0 28px 8px;}
footer.bot .info{font-size:20px;color:#3d5a52;flex:1;min-width:0}
button{font-family:inherit;cursor:pointer}
.btn{border:0;border-radius:12px;background:#006751;color:#fff;font-size:24px;font-weight:700;padding:11px 22px;min-height:50px;box-shadow:0 2px 0 #00483a;transition:transform .06s,background .15s}
.btn:hover{background:#00795f}.btn:active{transform:translateY(2px);box-shadow:none}
.btn.sec{background:#dedfe0;color:#12332b;box-shadow:0 2px 0 #b9bbbd}.btn.sec:hover{background:#d0d2d4}
.btn.lime{background:#dbe68d;color:#12332b;box-shadow:0 2px 0 #b4c05e}.btn.lime:hover{background:#d2e070}
.btn:disabled{opacity:.45;cursor:default}
.btn.fs{background:#fff;color:#006751;border:2px solid #006751;box-shadow:none;font-size:20px;padding:8px 16px;min-height:44px;margin-left:auto;white-space:nowrap}
.card{background:#fff;border-radius:16px;box-shadow:0 2px 10px rgba(0,60,45,.13)}
.pill{display:inline-block;background:#dbe68d;border-radius:999px;padding:4px 16px;font-size:21px;font-weight:700}
.ok{color:#11703f}.bad{color:#b3261e}
.fb{font-size:23px;line-height:1.3;border-radius:14px;padding:14px 18px;background:#eef3e0;border-left:8px solid #006751}
.fb.bad{background:#fdecea;border-left-color:#b3261e;color:#5f1611}
.fb.okb{background:#e3f4e8;border-left-color:#11703f;color:#0d4a2b}
.src{font-size:15px;color:#6a7f78}
.hidden{display:none!important}

.tm{display:flex;flex-direction:column;gap:10px;align-items:center}
.tm-lab{font-size:20px;color:#3d5a52}
.tm-row{display:flex;gap:10px;align-items:center;justify-content:center}
.tm-disp{font-size:74px;font-weight:700;color:#006751;min-width:210px;text-align:center;font-variant-numeric:tabular-nums;line-height:1}
.tm-disp.tm-end{color:#b3261e}

.tm-row .btn{font-size:21px;padding:9px 14px;white-space:nowrap}
.tm-s{font-size:34px;width:58px;padding:0;min-height:58px}
</style></head>
<body><div id="wrap"><div id="stage">
<header class="top"><span class="tema">7.5</span><h1>Mērogs un samērs</h1><div class="sub">Ieliec ielā jaunu ēku. Maini augstumu, platumu un jumtu, līdz ēka iederas.</div></header>

<style>
main{display:grid;grid-template-columns:1060px 1fr;gap:22px}
#cv{width:1060px;height:700px;border-radius:14px;box-shadow:0 2px 10px rgba(0,60,45,.13);display:block;background:#fff}
.side{display:flex;flex-direction:column;gap:10px}
.side h3{font-size:22px;color:#006751}
.sc{display:grid;gap:8px}
.sc .btn{font-size:21px;padding:8px 12px;text-align:left}
.btn.on{background:#006751;color:#fff;box-shadow:0 2px 0 #00483a}
.sl{font-size:22px;font-weight:700}
input[type=range]{width:100%;height:38px;accent-color:#006751}
.row{display:flex;gap:8px}
.row .btn{font-size:21px;padding:8px 12px;flex:1}
.fb{font-size:21px}
.num{font-size:21px;background:#eef3e0;border-radius:12px;padding:10px 14px;line-height:1.3}
</style>
<main>
  <canvas id="cv" width="1060" height="700"></canvas>
  <div class="side">
    <h3>Vieta</h3>
    <div class="sc" id="sc"></div>
    <div class="sl">Stāvu skaits: <span id="vf"></span><input type="range" id="fl" min="1" max="12" value="6"></div>
    <div class="sl">Platums: <span id="vw"></span><input type="range" id="wd" min="6" max="20" value="20"></div>
    <div class="row"><button class="btn sec on" id="rf">Plakans jumts</button><button class="btn sec" id="rp">Divslīpju jumts</button></div>
    <div class="num" id="num"></div>
    <div class="fb" id="fb"></div>
    <button class="btn" id="check" style="margin-top:auto">Pārbaudīt samēru</button>
  </div>
</main>
<footer class="bot">
  <div class="info">Mērogs – ēkas lielums pret cilvēku. Samērs – ēkas daļu un blakus ēku lielumu attiecības.</div>
  <button class="btn fs" id="fsbtn"></button>
</footer>
<script>
(function(){
  var stage=document.getElementById('stage');
  function fit(){var s=Math.min(window.innerWidth/1600,window.innerHeight/900);stage.style.transform='scale('+s+')';}
  window.addEventListener('resize',fit);fit();
  var fsb=document.getElementById('fsbtn');
  function isFs(){return document.fullscreenElement||document.webkitFullscreenElement||document.msFullscreenElement;}
  function upd(){if(fsb)fsb.textContent=isFs()?'⛶ Aizvērt pilnekrāna režīmu':'⛶ Atvērt pilnekrāna režīmu';fit();}
  if(fsb)fsb.addEventListener('click',function(){
    var d=document.documentElement;
    if(!isFs()){var f=d.requestFullscreen||d.webkitRequestFullscreen||d.msRequestFullscreen;if(f){try{var p=f.call(d);if(p&&p.catch)p.catch(function(){});}catch(e){}}}
    else{var x=document.exitFullscreen||document.webkitExitFullscreen||document.msExitFullscreen;if(x)x.call(document);}
  });
  ['fullscreenchange','webkitfullscreenchange','MSFullscreenChange'].forEach(function(e){document.addEventListener(e,upd);});
  upd();
  window.U={
    shuffle:function(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;},
    el:function(tag,attrs,kids){var e=document.createElement(tag);if(attrs)for(var k in attrs){if(k==='class')e.className=attrs[k];else if(k==='html')e.innerHTML=attrs[k];else if(k==='text')e.textContent=attrs[k];else if(k.slice(0,2)==='on')e.addEventListener(k.slice(2),attrs[k]);else e.setAttribute(k,attrs[k]);}
      (kids||[]).forEach(function(c){if(c)e.appendChild(typeof c==='string'?document.createTextNode(c):c);});return e;},
    $:function(s){return document.querySelector(s);},
    scale:function(){return Math.min(window.innerWidth/1600,window.innerHeight/900);},
    /* Taimeris: mount(el,{min:5}) -> pogas Sākt / Apturēt, laiku iestata skolotājs */
    timer:function(host,opt){
      opt=opt||{};var total=(opt.min||5)*60,left=total,run=false,iv=null;
      var disp=U.el('div',{class:'tm-disp'});var minus=U.el('button',{class:'btn sec tm-s',text:'−'});var plus=U.el('button',{class:'btn sec tm-s',text:'+'});
      var start=U.el('button',{class:'btn',text:'Sākt'});var stop=U.el('button',{class:'btn sec',text:'Apturēt'});var reset=U.el('button',{class:'btn sec',text:'No sākuma'});
      var lab=U.el('div',{class:'tm-lab',text:'Laiku iestata skolotājs:'});
      function fmt(s){var m=Math.floor(s/60),x=s%60;return m+':'+(x<10?'0':'')+x;}
      function draw(){disp.textContent=fmt(left);disp.classList.toggle('tm-end',left===0);start.disabled=run||left===0;stop.disabled=!run;minus.disabled=run;plus.disabled=run;}
      function halt(){run=false;if(iv){clearInterval(iv);iv=null;}draw();}
      minus.onclick=function(){if(run)return;total=Math.max(60,total-60);left=total;draw();};
      plus.onclick=function(){if(run)return;total=Math.min(45*60,total+60);left=total;draw();};
      start.onclick=function(){if(run||left===0)return;run=true;iv=setInterval(function(){left--;if(left<=0){left=0;halt();if(opt.onEnd)opt.onEnd();}draw();},1000);draw();};
      stop.onclick=halt;reset.onclick=function(){halt();left=total;draw();};
      host.appendChild(U.el('div',{class:'tm'},[lab,U.el('div',{class:'tm-row'},[minus,disp,plus]),U.el('div',{class:'tm-row'},[start,stop,reset])]));
      draw();return {reset:function(){halt();left=total;draw();}};
    }
  };
})();

(function(){
var M=14,FL=3,GY=610,GAP=20;
var SC=[
 {n:'Mazpilsētas iela',sky:'#dff0f7',L:[[9,2,1,'#e7d3a8'],[11,2,1,'#c9d8c0'],[10,3,1,'#f0e2c8']],R:[[10,2,1,'#d9c3b0'],[12,3,1,'#e7d3a8'],[9,2,1,'#c9d8c0']],trees:1},
 {n:'Lielpilsētas centrs',sky:'#e3e8ee',L:[[14,7,0,'#c7cdd3'],[12,9,0,'#b9c4cc'],[13,8,0,'#d5d2c8']],R:[[13,8,0,'#d5d2c8'],[14,10,0,'#c7cdd3'],[12,7,0,'#b9c4cc']],trees:0},
 {n:'Ciema mala',sky:'#e4f3e2',L:[[11,1,1,'#f0e2c8'],[9,1,1,'#d9c3b0'],[12,1,1,'#e7d3a8']],R:[[10,1,1,'#e7d3a8'],[11,1,1,'#f0e2c8'],[9,1,1,'#d9c3b0']],trees:2}];
var cur=SC[0],P={fl:6,w:20,pitch:0};
var cv=U.$('#cv'),c=cv.getContext('2d');
function bld(x,wm,fl,pitch,col,isNew){var w=wm*M,h=fl*FL*M,y=GY-h;c.fillStyle=col;c.strokeStyle='#3a4a45';c.lineWidth=isNew?4:2;c.fillRect(x,y,w,h);c.strokeRect(x,y,w,h);
  if(pitch){var rh=Math.min(w*0.32,60);c.fillStyle=isNew?'#a8542f':'#8a5a44';c.beginPath();c.moveTo(x-8,y);c.lineTo(x+w/2,y-rh);c.lineTo(x+w+8,y);c.closePath();c.fill();c.stroke();}
  else{c.fillStyle='#55605c';c.fillRect(x-3,y-7,w+6,8);}
  var n=Math.max(1,Math.floor(wm/3.2)),ww=18,sp=w/n;for(var f=0;f<fl;f++)for(var i=0;i<n;i++){var wx=x+sp*i+sp/2-ww/2,wy=GY-(f+1)*FL*M+10;if(f===0&&i===Math.floor(n/2)){c.fillStyle='#6b4a34';c.fillRect(wx-2,GY-30,22,30);}else{c.fillStyle=isNew?'#9fd0e6':'#b9d6e2';c.fillRect(wx,wy,ww,21);c.strokeStyle='#3a4a45';c.lineWidth=1;c.strokeRect(wx,wy,ww,21);}}
  return h+(pitch?Math.min(w*0.32,60):0);}
function man(x){var h=1.7*M;c.fillStyle='#b3261e';c.beginPath();c.arc(x,GY-h+4,4,0,7);c.fill();c.fillRect(x-3.5,GY-h+8,7,h*0.45);c.fillRect(x-3.5,GY-h*0.5,3,h*0.5);c.fillRect(x+0.5,GY-h*0.5,3,h*0.5);}
function tree(x,s){c.fillStyle='#6b4a34';c.fillRect(x-4,GY-40*s,8,40*s);c.fillStyle='#5f9b62';c.beginPath();c.arc(x,GY-70*s,34*s,0,7);c.arc(x-20*s,GY-48*s,24*s,0,7);c.arc(x+20*s,GY-48*s,24*s,0,7);c.fill();}
function draw(){var W=1060,H=700;c.fillStyle=cur.sky;c.fillRect(0,0,W,H);c.fillStyle=cur.trees===2?'#9cc487':'#b9b9b4';c.fillRect(0,GY,W,H-GY);c.fillStyle='#8f8f8a';c.fillRect(0,GY,W,6);
  var gapPx=GAP*M,cx=W/2,x=cx-gapPx/2;if(cur.trees===2){tree(60,1.5);tree(1000,1.7);tree(960,1.1);}
  for(var i=cur.L.length-1,xx=x;i>=0;i--){var b=cur.L[i];xx-=b[0]*M;bld(xx,b[0],b[1],b[2],b[3]);}
  xx=cx+gapPx/2;cur.R.forEach(function(b){bld(xx,b[0],b[1],b[2],b[3]);xx+=b[0]*M;});
  var nw=P.w*M;bld(cx-nw/2,P.w,P.fl,P.pitch,'#dbe68d',true);
  man(cx+nw/2+16);man(120);man(900);
  c.fillStyle='#12332b';c.font='700 22px Candara,Segoe UI,sans-serif';c.fillText(cur.n,22,34);c.font='18px Candara,Segoe UI,sans-serif';c.fillText('Sarkanā figūra – 1,7 m garš cilvēks',22,60);}
function avg(){var a=cur.L.concat(cur.R),s=0;a.forEach(function(b){s+=b[1]});return s/a.length;}
function upd(){U.$('#vf').textContent=P.fl;U.$('#vw').textContent=P.w+' m';var h=P.fl*FL;U.$('#num').innerHTML='Ēkas augstums līdz jumta dzegai: <b>'+h+' m</b>. Tie ir apmēram <b>'+Math.round(h/1.7)+'</b> cilvēka augumi.';draw();}
U.$('#fl').oninput=function(){P.fl=+this.value;upd();};U.$('#wd').oninput=function(){P.w=+this.value;upd();};
function roof(p){P.pitch=p;U.$('#rf').classList.toggle('on',!p);U.$('#rp').classList.toggle('on',!!p);upd();}
U.$('#rf').onclick=function(){roof(0)};U.$('#rp').onclick=function(){roof(1)};
SC.forEach(function(s,i){var b=U.el('button',{class:'btn sec'+(i===0?' on':''),text:s.n});b.onclick=function(){cur=s;[].forEach.call(U.$('#sc').children,function(x){x.classList.remove('on')});b.classList.add('on');U.$('#fb').className='fb';U.$('#fb').textContent='Ieliec ēku tā, lai tā iederas starp kaimiņiem.';upd();};U.$('#sc').appendChild(b);});
U.$('#check').onclick=function(){var r=P.fl/avg(),fb=U.$('#fb'),np=cur.L[0][2],t=[];
  if(r>1.6)t.push('Ēka ir '+(Math.round(r*10)/10+'').replace('.',',')+' reizes augstāka par kaimiņiem – tā <b>dominē</b> pār ielu.');
  else if(r<0.6)t.push('Ēka ir daudz zemāka par kaimiņiem – apbūvē rodas <b>robs</b>.');
  else t.push('Augstums ir <b>samērīgs</b> ar kaimiņu ēkām.');
  if(!!P.pitch!==!!np)t.push('Jumta forma atšķiras no kaimiņu jumtiem.');else t.push('Jumta forma sasaucas ar kaimiņiem.');
  if(P.w<10)t.push('Ēka ir šaura – abās pusēs paliek tukšums.');
  var ok=r<=1.6&&r>=0.6&&!!P.pitch===!!np&&P.w>=10;fb.className='fb '+(ok?'okb':'bad');
  fb.innerHTML=t.join(' ')+(ok?' <b>Ēka iederas.</b> Pārrunājiet: kurām ēkām drīkst dominēt (baznīcai, rātsnamam, tornim) un kāpēc?':' Pamēģini mainīt un pārbaudi vēlreiz.');};
U.$('#fb').textContent='Ieliec ēku tā, lai tā iederas starp kaimiņiem.';upd();
})();
</script>

</div></div></body></html>
