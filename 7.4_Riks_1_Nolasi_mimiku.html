<!DOCTYPE html>
<html lang="lv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>7.4 Nolasi mīmiku – interaktīvs rīks</title>
<style>*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#0b2a23;font-family:Candara,"Segoe UI","Trebuchet MS",Verdana,sans-serif;color:#12332b}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{width:1600px;height:900px;flex:none;transform-origin:center center;background:#f6f7f4;position:relative;overflow:hidden;display:flex;flex-direction:column}
header.top{height:74px;flex:none;background:#006751;color:#fff;display:flex;align-items:center;padding:0 28px;gap:20px}
header.top .tema{background:#dbe68d;color:#12332b;font-weight:700;border-radius:8px;padding:6px 14px;font-size:22px;white-space:nowrap}
header.top h1{font-size:34px;font-weight:700;letter-spacing:.2px;white-space:nowrap}
header.top .sub{font-size:21px;opacity:.92;margin-left:auto;text-align:right;line-height:1.15;max-width:760px}
main{flex:1;min-height:0;position:relative;padding:18px 28px 10px}
footer.bot{height:62px;flex:none;display:flex;align-items:center;gap:14px;padding:0 28px 8px;}
footer.bot .info{font-size:20px;color:#3d5a52;flex:1;min-width:0}
button{font-family:inherit;cursor:pointer}
.btn{border:0;border-radius:12px;background:#006751;color:#fff;font-size:24px;font-weight:700;padding:11px 22px;min-height:50px;box-shadow:0 2px 0 #00483a;transition:transform .06s,background .15s}
.btn:hover{background:#00795f}.btn:active{transform:translateY(2px);box-shadow:none}
.btn.sec{background:#dedfe0;color:#12332b;box-shadow:0 2px 0 #b9bbbd}.btn.sec:hover{background:#d0d2d4}
.btn.lime{background:#dbe68d;color:#12332b;box-shadow:0 2px 0 #b4c05e}.btn.lime:hover{background:#d2e070}
.btn:disabled{opacity:.45;cursor:default}
.btn.fs{background:#fff;color:#006751;border:2px solid #006751;box-shadow:none;font-size:20px;padding:8px 16px;min-height:44px;margin-left:auto;white-space:nowrap}
.card{background:#fff;border-radius:16px;box-shadow:0 2px 10px rgba(0,60,45,.13)}
.pill{display:inline-block;background:#dbe68d;border-radius:999px;padding:4px 16px;font-size:21px;font-weight:700}
.ok{color:#11703f}.bad{color:#b3261e}
.fb{font-size:23px;line-height:1.3;border-radius:14px;padding:14px 18px;background:#eef3e0;border-left:8px solid #006751}
.fb.bad{background:#fdecea;border-left-color:#b3261e;color:#5f1611}
.fb.okb{background:#e3f4e8;border-left-color:#11703f;color:#0d4a2b}
.src{font-size:15px;color:#6a7f78}
.hidden{display:none!important}

.tm{display:flex;flex-direction:column;gap:10px;align-items:center}
.tm-lab{font-size:21px;color:#3d5a52;display:flex;align-items:center;gap:8px}
.tm-in{font:inherit;font-size:26px;font-weight:700;width:92px;height:46px;text-align:center;border:3px solid #006751;border-radius:10px;color:#12332b;background:#fff}
.tm-row{display:flex;gap:10px;align-items:center;justify-content:center}
.tm-disp{font-size:74px;font-weight:700;color:#006751;min-width:210px;text-align:center;font-variant-numeric:tabular-nums;line-height:1}
.tm-disp.tm-end{color:#b3261e}

.tm-row .btn{font-size:21px;padding:9px 14px;white-space:nowrap}
.tm-s{font-size:34px;width:58px;padding:0;min-height:58px}
</style></head>
<body><div id="wrap"><div id="stage">
<header class="top"><span class="tema">7.4</span><h1>Nolasi mīmiku</h1><div class="sub">Mīmika ir sejas muskuļu kustības, kas parāda emocijas.</div></header>
<style>
main{display:grid;grid-template-columns:820px 1fr;gap:24px}
.pic{background:#fff;border-radius:16px;box-shadow:0 2px 10px rgba(0,60,45,.13);padding:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0;height:100%}
.pic .im{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
.pic img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px;display:block}
.pic img.inv{filter:invert(1)}
.cap{font-size:19px;color:#3d5a52;margin-top:8px;text-align:center;line-height:1.15}
.qa{display:flex;flex-direction:column;gap:12px;min-height:0}
.prog{font-size:22px;font-weight:700;color:#006751}
.q{font-size:30px;font-weight:700;line-height:1.15}
.opts{display:grid;gap:10px}
.opt{border:3px solid #006751;background:#fff;color:#12332b;border-radius:14px;font-size:24px;font-weight:700;padding:11px 16px;text-align:left;min-height:58px;line-height:1.15}
.opt:hover{background:#eef3e0}
.opt.good{background:#cfeeda;border-color:#11703f}
.opt.wrong{background:#fbd9d5;border-color:#b3261e}
.opt:disabled{cursor:default}
.fb{font-size:22px}
.end{position:absolute;inset:0;background:#f6f7f4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center}
.end h2{font-size:52px;color:#006751}.end p{font-size:30px;max-width:1000px}
</style>
<main>
  <div class="pic"><div class="im"><img id="im" alt=""></div><div class="cap" id="cap"></div></div>
  <div class="qa">
    <div class="prog" id="prog"></div>
    <div class="q" id="q"></div>
    <div class="opts" id="opts"></div>
    <div class="fb hidden" id="fb"></div>
    <div style="display:flex;gap:12px;margin-top:auto">
      <button class="btn sec hidden" id="inv">Apmainīt melno un balto</button>
      <button class="btn hidden" id="next" style="margin-left:auto">Nākamais →</button>
    </div>
  </div>
  <div class="end hidden" id="end"><h2 id="eh"></h2><p id="ep"></p><button class="btn" id="re">Mēģināt vēlreiz</button></div>
</main>
<footer class="bot">
  <div class="info">Skaties uz trim vietām: uzacīm, acīm un muti.</div>
  <button class="btn fs" id="fsbtn"></button>
</footer>
<script>
(function(){
  var stage=document.getElementById('stage');
  function fit(){var s=Math.min(window.innerWidth/1600,window.innerHeight/900);stage.style.transform='scale('+s+')';}
  window.addEventListener('resize',fit);fit();
  var fsb=document.getElementById('fsbtn');
  function isFs(){return document.fullscreenElement||document.webkitFullscreenElement||document.msFullscreenElement;}
  function upd(){if(fsb)fsb.textContent=isFs()?'⛶ Aizvērt pilnekrāna režīmu':'⛶ Atvērt pilnekrāna režīmu';fit();}
  if(fsb)fsb.addEventListener('click',function(){
    var d=document.documentElement;
    if(!isFs()){var f=d.requestFullscreen||d.webkitRequestFullscreen||d.msRequestFullscreen;if(f){try{var p=f.call(d);if(p&&p.catch)p.catch(function(){});}catch(e){}}}
    else{var x=document.exitFullscreen||document.webkitExitFullscreen||document.msExitFullscreen;if(x)x.call(document);}
  });
  ['fullscreenchange','webkitfullscreenchange','MSFullscreenChange'].forEach(function(e){document.addEventListener(e,upd);});
  upd();
  window.U={
    shuffle:function(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;},
    el:function(tag,attrs,kids){var e=document.createElement(tag);if(attrs)for(var k in attrs){if(k==='class')e.className=attrs[k];else if(k==='html')e.innerHTML=attrs[k];else if(k==='text')e.textContent=attrs[k];else if(k.slice(0,2)==='on')e.addEventListener(k.slice(2),attrs[k]);else e.setAttribute(k,attrs[k]);}
      (kids||[]).forEach(function(c){if(c)e.appendChild(typeof c==='string'?document.createTextNode(c):c);});return e;},
    $:function(s){return document.querySelector(s);},
    scale:function(){return Math.min(window.innerWidth/1600,window.innerHeight/900);},
    /* Taimeris: mount(el,{min:5}) -> pogas Sākt / Apturēt, laiku iestata skolotājs */
    timer:function(host,opt){
      opt=opt||{};var total=(opt.min||5)*60,left=total,run=false,iv=null;
      var disp=U.el('div',{class:'tm-disp'});var minus=U.el('button',{class:'btn sec tm-s',text:'−'});var plus=U.el('button',{class:'btn sec tm-s',text:'+'});
      var start=U.el('button',{class:'btn',text:'Sākt'});var stop=U.el('button',{class:'btn sec',text:'Apturēt'});var reset=U.el('button',{class:'btn sec',text:'No sākuma'});
      var inp=U.el('input',{type:'number',min:'1',max:'90',value:String(opt.min||5),class:'tm-in','aria-label':'Laiks minūtēs'});
      var lab=U.el('div',{class:'tm-lab'},['Laiks minūtēs: ',inp]);
      function fromInp(){if(run)return;var v=parseInt(inp.value,10);if(isNaN(v))return;v=Math.max(1,Math.min(90,v));total=v*60;left=total;draw();}
      inp.addEventListener('input',fromInp);inp.addEventListener('change',function(){fromInp();inp.value=Math.round(total/60);});
      function fmt(s){var m=Math.floor(s/60),x=s%60;return m+':'+(x<10?'0':'')+x;}
      function draw(){disp.textContent=fmt(left);disp.classList.toggle('tm-end',left===0);start.disabled=run||left===0;stop.disabled=!run;minus.disabled=run;plus.disabled=run;inp.disabled=run;}
      function halt(){run=false;if(iv){clearInterval(iv);iv=null;}draw();}
      minus.onclick=function(){if(run)return;total=Math.max(60,total-60);left=total;inp.value=Math.round(total/60);draw();};
      plus.onclick=function(){if(run)return;total=Math.min(90*60,total+60);left=total;inp.value=Math.round(total/60);draw();};
      start.onclick=function(){if(run||left===0)return;run=true;iv=setInterval(function(){left--;if(left<=0){left=0;halt();if(opt.onEnd)opt.onEnd();}draw();},1000);draw();};
      stop.onclick=halt;reset.onclick=function(){halt();left=total;draw();};
      host.appendChild(U.el('div',{class:'tm'},[lab,U.el('div',{class:'tm-row'},[minus,disp,plus]),U.el('div',{class:'tm-row'},[start,stop,reset])]));
      draw();return {reset:function(){halt();left=total;draw();}};
    }
  };
})();
